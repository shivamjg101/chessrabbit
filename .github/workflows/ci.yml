name: CI

on:
  push:
    branches: [main, 'codex/open-source-local-engines']
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chessrabbit
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: chessrabbit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chessrabbit"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        # requirements-dev pulls in requirements plus pytest; installing the
        # runtime file alone is why the tests under apps/api/tests never ran.
        run: pip install -r apps/api/requirements-dev.txt
      - name: Lint
        run: ruff check apps/api services/engine pipeline
      - name: Apply migrations
        # Every migration, in filename order - the same order initdb applies
        # them to a fresh docker volume. Only 001 used to run here, so 002
        # onward reached production having never been executed anywhere except
        # a developer's own database. ON_ERROR_STOP makes psql exit non-zero;
        # without it a failed statement is a printed notice and a green build.
        run: |
          sudo apt-get install -y postgresql-client
          for f in db/migrations/*.sql; do
            echo "-- $f"
            PGPASSWORD=devpassword psql -v ON_ERROR_STOP=1 --quiet \
              -h 127.0.0.1 -U chessrabbit -d chessrabbit -f "$f"
          done
      - name: Import check
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://chessrabbit:devpassword@127.0.0.1:5432/chessrabbit
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET: ci-secret
        run: python -c "from app.main import app; print('routes:', len(app.openapi()['paths']))"
      - name: Tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://chessrabbit:devpassword@127.0.0.1:5432/chessrabbit
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET: ci-secret
          # Read by tests/test_schema_matches_migrations.py, which compares the
          # models against the database the step above just built.
          CHESSRABBIT_TEST_DB: postgresql+asyncpg://chessrabbit:devpassword@127.0.0.1:5432/chessrabbit
        run: python -m pytest -q

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine deps + stockfish
        run: |
          sudo apt-get update && sudo apt-get install -y stockfish
          pip install -r services/engine/requirements.txt pytest pytest-asyncio
      - name: UCI profile regression tests
        run: python -m pytest services/engine/tests -q
      - name: UCI parser + live engine smoke test
        working-directory: services/engine
        run: |
          python - << 'PY'
          import asyncio
          from uci import parse_info_line, StockfishEngine

          # parser
          r = parse_info_line("info depth 20 multipv 1 score cp 34 pv e2e4 e7e5")
          assert r.cp == 34 and r.pv[0] == "e2e4"
          assert parse_info_line("info string chatter") is None

          # live engine
          async def smoke():
              e = StockfishEngine(threads=1, hash_mb=64)
              await e.start()
              best = None
              async for item in e.analyse(
                  "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
                  depth=10,
              ):
                  if isinstance(item, dict):
                      best = item["move"]
              await e.close()
              assert best, "no bestmove"
              print("bestmove:", best)

          asyncio.run(smoke())
          PY

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck + lint + test + build
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

  local-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start local installation
        run: docker compose up --build -d
      - name: Personal workspace and Stockfish analysis smoke test
        run: python scripts/smoke_local.py
      - name: Logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop test services
        if: always()
        run: docker compose down -v
